version: '3.8'

services:
  # 1. The Database Container (Replaces XAMPP/MAMP)
  mysql-db:
    image: mysql:8.0
    container_name: jomoro_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      # We create a generic database here, but Prisma will push the specific schemas later
      MYSQL_DATABASE: jomoro_master 
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. Auth Service
  auth-service:
    build:
      context: ./auth-service
    container_name: jomoro_auth
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=mysql://root:root@mysql-db:3306/jomoro_auth
      - JWT_SECRET=jomoro_secret_key
    depends_on:
      - mysql-db

  # 3. Product Service
  product-service:
    build:
      context: ./product-service
    container_name: jomoro_product
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATABASE_URL=mysql://root:root@mysql-db:3306/jomoro_product
      - JWT_SECRET=jomoro_secret_key
    depends_on:
      - mysql-db

  # 4. Transaction Service
  transaction-service:
    build:
      context: ./transaction-service
    container_name: jomoro_transaction
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DATABASE_URL=mysql://root:root@mysql-db:3306/jomoro_transaction
      - JWT_SECRET=jomoro_secret_key
      - PRODUCT_SERVICE_URL=http://product-service:3002
    depends_on:
      - mysql-db
      - product-service

  # 5. API Gateway
  api-gateway:
    build:
      context: ./api-gateway
    container_name: jomoro_gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - TRANSACTION_SERVICE_URL=http://transaction-service:3003
    depends_on:
      - auth-service
      - product-service
      - transaction-service

volumes:
  mysql_data: